# Konfigurasi Prometheus untuk BigOracle
# Prometheus berjalan di dalam Docker, sedangkan exporter berjalan di mesin host (port 8000).
# host.docker.internal = alamat mesin host dari dalam container (Docker Desktop Mac/Windows;
# pada Linux disediakan lewat extra_hosts di docker-compose.yml).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "bigoracle_exporter"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
